<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" fill="none">
  <defs>
    <linearGradient id="gsOrangeGradH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA24C" />
      <stop offset="100%" stop-color="#F28C28" />
    </linearGradient>
    <linearGradient id="gsBlueGradH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3864" />
      <stop offset="100%" stop-color="#101C35" />
    </linearGradient>
    <filter id="glowH" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#F28C28" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- GS Monogram Badge -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="100" height="100" rx="20" fill="#101C35" stroke="#1D3C6A" stroke-width="2.5" />
    
    <!-- Blueprint grid accent -->
    <line x1="0" y1="33" x2="100" y2="33" stroke="#173D65" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.6"/>
    <line x1="0" y1="66" x2="100" y2="66" stroke="#173D65" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.6"/>
    <line x1="33" y1="0" x2="33" y2="100" stroke="#173D65" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.6"/>
    <line x1="66" y1="0" x2="66" y2="100" stroke="#173D65" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.6"/>

    <!-- G Shape -->
    <path d="M 52 24 
             L 30 24 
             A 24 24 0 0 0 30 74 
             L 54 74 
             L 54 53 
             L 42 53" 
          stroke="url(#gsOrangeGradH)" 
          stroke-width="8.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          fill="none" 
          filter="url(#glowH)" />

    <!-- S Shape -->
    <path d="M 76 34 
             C 76 25 60 23 54 31 
             C 46 41 77 48 77 65 
             C 77 80 57 82 46 76" 
          stroke="#FFFFFF" 
          stroke-width="7.5" 
          stroke-linecap="round" 
          fill="none" />

    <!-- Accent apex -->
    <polygon points="50,11 55,20 45,20" fill="#F28C28" />
  </g>

  <!-- Typography: GLOBAL SERVICE -->
  <text x="135" y="58" font-family="'Sora', 'Segoe UI', 'Montserrat', sans-serif" font-size="36" font-weight="800" fill="#FFFFFF" letter-spacing="2">
    GLOBAL <tspan fill="#F28C28">SERVICE</tspan>
  </text>
  
  <!-- Sub-label: GÉNIE CIVIL & BTP -->
  <text x="137" y="86" font-family="'Manrope', 'Segoe UI', 'Inter', sans-serif" font-size="14" font-weight="600" fill="#D9DEE5" letter-spacing="4.5">
    GÉNIE CIVIL &amp; BÂTIMENT · BÉNIN
  </text>

  <!-- Decorative technical line -->
  <line x1="137" y1="96" x2="510" y2="96" stroke="#173D65" stroke-width="1.5" />
  <circle cx="510" cy="96" r="3" fill="#F28C28" />
</svg>

